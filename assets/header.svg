<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="35%" stop-color="#FF4D4D"/>
      <stop offset="65%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF1A1A" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF1A1A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.30">
        <animate attributeName="stop-opacity" values="0.10;0.40;0.10" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" rx="2" fill="#30363D" opacity="0.45"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="50%" r="68%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="cardClip">
      <rect width="900" height="280" rx="18"/>
    </clipPath>
  </defs>

  <rect width="900" height="280" rx="18" fill="#0D1117"/>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="280" fill="url(#glow1)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,-20; 0,0" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect width="900" height="280" fill="url(#glow2)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -50,25; 0,0" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 粒子层 -->
  <g clip-path="url(#cardClip)">
    <circle cx="80" cy="50" r="2.5" fill="#FF4D4D" opacity="0.7">
      <animate attributeName="cy" values="50;25;50" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="210" r="2" fill="#FF1A1A" opacity="0.6">
      <animate attributeName="cy" values="210;185;210" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="90" r="3" fill="#FF4D4D" opacity="0.5">
      <animate attributeName="cy" values="90;65;90" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="60" r="2.5" fill="#FFD700" opacity="0.7">
      <animate attributeName="cy" values="60;35;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="200" r="2" fill="#FFA500" opacity="0.6">
      <animate attributeName="cy" values="200;175;200" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="100" r="3" fill="#FFD700" opacity="0.5">
      <animate attributeName="cy" values="100;75;100" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="130" r="1.5" fill="#FFFFFF" opacity="0.5">
      <animate attributeName="cy" values="130;110;130" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="40" r="1.5" fill="#FFFFFF" opacity="0.4">
      <animate attributeName="cy" values="40;20;40" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="240" r="1.5" fill="#FFFFFF" opacity="0.45">
      <animate attributeName="cy" values="240;220;240" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="150" r="1.5" fill="#FFFFFF" opacity="0.4">
      <animate attributeName="cy" values="150;130;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="900" height="280" rx="18" fill="url(#dots)"/>
  <rect width="900" height="280" rx="18" fill="url(#vignette)"/>
  <rect x="1" y="1" width="898" height="278" rx="17" fill="none" stroke="#30363D" stroke-width="2"/>

  <text x="450" y="138" text-anchor="middle" fill="url(#nameGrad)"
        font-family="STXingkai, STKaiti, KaiTi, STSong, SimSun, serif"
        font-size="130" letter-spacing="2">董柏杨</text>

  <text x="450" y="186" text-anchor="middle" fill="#8B949E"
        font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
        font-size="21" letter-spacing="3">@alanmoore</text>

  <text x="450" y="224" text-anchor="middle" fill="#C9D1D9"
        font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
        font-size="22">Java 后端 &amp; Spring AI 应用开发　·　Python &amp; LangGraph 智能体</text>

  <text x="450" y="254" text-anchor="middle" fill="#7D8590"
        font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
        font-size="18">先把原理搞懂，再把代码写干净</text>
</svg>
