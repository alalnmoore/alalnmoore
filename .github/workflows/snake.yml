name: Generate snake animation

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）刷新一次
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots：无贡献 → 最高贡献共 5 个颜色，第 1 个是「无贡献」格子（深黑）
          # color_snake：贪吃蛇本体颜色
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00CFFF&color_dots=#0D1117,#01311F,#034525,#0F6D31,#00C647

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
